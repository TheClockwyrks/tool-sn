[package]
name = "test-cabinet-sn-skin"
description = "The sn-skin binary a run image carries to build a skinned surface-nets character."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The `sn-skin` binary: the Surface Nets skinned-character tool (smooth mid-fidelity
# surface character). It pins the surface-nets algorithm and delegates the whole command
# surface to `test-cabinet-model-skin` (the shared skinning CLI — the skeleton binding,
# skin weighting, and skinned-`.glb` encode). The Marching Cubes / Dual Contouring
# siblings are `mc-skin` / `dc-skin`. See
# <https://docs.testcabinet.ai/testing/asset-generation/skinned-binaries/>.
[[bin]]
name = "sn-skin"
path = "src/main.rs"

[dependencies]
# The shared skinning library, with its `cli` feature (the whole command
# surface and the renderer stack).
test-cabinet-model-skin = { workspace = true, features = ["cli"] }

[lints]
workspace = true
